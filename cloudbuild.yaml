# Builds and deploys to Cloud Run on every push to main (same setup as the
# practice scheduler). Uses --update-env-vars so settings you add later by
# hand (email, app link) are kept on each deploy.
substitutions:
  _SERVICE: qybsl-umpire-assigner
  _REGION: us-east1
  _FIRESTORE_DB: umpires
  _ADMIN_EMAILS: higgins.qyb@gmail.com

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/${_SERVICE}:$COMMIT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/${_SERVICE}:$COMMIT_SHA']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --max-instances=2
      - --update-env-vars=FIRESTORE_PROJECT_ID=$PROJECT_ID,FIRESTORE_DATABASE_ID=${_FIRESTORE_DB},ADMIN_EMAILS=${_ADMIN_EMAILS}

  # Test copy: same code, separate database, TEST_MODE banner, and it only
  # ever messages John's own addresses.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}-test
      - --image=gcr.io/$PROJECT_ID/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --max-instances=1
      - --update-env-vars=FIRESTORE_PROJECT_ID=$PROJECT_ID,FIRESTORE_DATABASE_ID=umpires-test,ADMIN_EMAILS=${_ADMIN_EMAILS},TEST_MODE=1,TEST_SEND_ONLY=^higgins\.qyb

images:
  - gcr.io/$PROJECT_ID/${_SERVICE}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
