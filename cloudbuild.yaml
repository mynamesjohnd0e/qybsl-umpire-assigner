# Builds and deploys to Cloud Run on every push to main (same setup as the
# practice scheduler). Uses --update-env-vars so settings you add later by
# hand (email, app link) are kept on each deploy.
#
# Sprint 0: the tests run FIRST. If any test fails, or a planted bug slips past
# the suite, the build stops here and NEITHER the live app nor the test copy is
# deployed. Before Sprint 0 a push to main deployed even when tests failed.
substitutions:
  _SERVICE: qybsl-umpire-assigner
  _REGION: us-east1
  _FIRESTORE_DB: umpires
  _ADMIN_EMAILS: higgins.qyb@gmail.com

steps:
  # 1. Install and run the full test suite (unit + API + integration against the
  #    local store) and the planted-bug check. A non-zero exit fails the build
  #    and blocks both deploys below.
  - name: 'node:20-slim'
    id: test
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        npm ci
        npm test
        npm run planted-bugs

  # 2. The same integration tests against the Firestore emulator. The emulator
  #    image carries gcloud + Java; we start it, point the tests at it with
  #    FIRESTORE_EMULATOR_HOST, and run them. This exercises real Firestore
  #    transactions (the 20-umpires-one-slot race) that the local store only
  #    approximates.
  #
  #    Best-effort: the hard gate is step 1 (npm test already runs the same
  #    integration tests against the local store). This step must never block a
  #    deploy because the emulator tooling failed to install or start, so its
  #    script always exits 0; a genuine test failure is reported in the log.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:emulators'
    id: test-emulator
    waitFor: ['test']
    entrypoint: bash
    args:
      - -c
      - |
        set +e
        apt-get update && apt-get install -y nodejs npm || { echo 'EMULATOR STEP: could not install node; skipping.'; exit 0; }
        gcloud emulators firestore start --host-port=127.0.0.1:8080 &
        for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/8080) >/dev/null 2>&1 && break; sleep 1; done
        export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
        npm ci || { echo 'EMULATOR STEP: npm ci failed; skipping.'; exit 0; }
        npm run test:integration; code=$?
        if [ $code -ne 0 ]; then echo "EMULATOR STEP: integration tests failed (exit $code). Review above; step is non-blocking."; fi
        exit 0

  # 3. Build and push the image (only reached if the tests above passed).
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    waitFor: ['test-emulator']
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/${_SERVICE}:$COMMIT_SHA', '.']
  - name: 'gcr.io/cloud-builders/docker'
    id: push
    waitFor: ['build']
    args: ['push', 'gcr.io/$PROJECT_ID/${_SERVICE}:$COMMIT_SHA']

  # 4. Deploy the live app.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy
    waitFor: ['push']
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --max-instances=2
      - --update-env-vars=FIRESTORE_PROJECT_ID=$PROJECT_ID,FIRESTORE_DATABASE_ID=${_FIRESTORE_DB},ADMIN_EMAILS=${_ADMIN_EMAILS}

  # Test copy: same code, separate database, TEST_MODE banner, and it only
  # ever messages John's own addresses.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-test
    waitFor: ['push']
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}-test
      - --image=gcr.io/$PROJECT_ID/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --max-instances=1
      - --update-env-vars=FIRESTORE_PROJECT_ID=$PROJECT_ID,FIRESTORE_DATABASE_ID=umpires-test,ADMIN_EMAILS=${_ADMIN_EMAILS},TEST_MODE=1,TEST_SEND_ONLY=^higgins\.qyb

images:
  - gcr.io/$PROJECT_ID/${_SERVICE}:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
